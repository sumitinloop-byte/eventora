<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Details | Eventora</title>
  <meta name="description" content="Event details and registration on Eventora." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Event | Eventora" />
  <meta property="og:description" content="Event details and registration." />
  <meta property="og:image" content="" />
  <meta name="theme-color" content="#6c5ce7" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/theme.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <div id="progressBar" class="progress" aria-hidden="true"></div>

  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="logo" aria-label="Eventora home"><img src="assets/favicon.svg" alt="" width="30" height="30" /><b class="wordmark">Event<span>ora</span></b></a>
      <nav id="navLinks" class="nav-links" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="index.html#events">Events</a>
        <a href="index.html#about">About</a>
        <a href="index.html#contact">Contact</a>
        <a href="my-tickets.html" class="tickets-link">🎟️ My Tickets <span id="ticketCount" class="count" hidden>0</span></a>
      </nav>
      <div class="nav-actions">
        <button id="themeToggle" class="icon-btn" aria-label="Toggle dark mode">🌙</button>
        <button id="menuToggle" class="icon-btn menu-btn" aria-label="Open menu" aria-expanded="false" aria-controls="navLinks">☰</button>
      </div>
    </div>
  </header>

  <main id="main" class="container detail-wrap">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="index.html">Home</a> / <a href="index.html#events">Events</a> / <span id="crumbName">Event</span>
    </nav>

    <div class="detail-layout">
      <article id="eventDetail" class="detail"></article>

      <aside id="registerCard" class="register-card" aria-labelledby="regTitle">
        <h2 id="regTitle">Register for this event</h2>
        <p class="muted small-text">Fill in your details to reserve your spot.</p>

        <form id="regForm" novalidate>
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your full name" autocomplete="name" />
            <small class="error" role="alert"></small>
          </div>
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" />
            <small class="error" role="alert"></small>
          </div>
          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="10-digit mobile number" maxlength="10" inputmode="numeric" autocomplete="tel" />
            <small class="error" role="alert"></small>
          </div>
          <div class="form-group">
            <label for="eventSelect">Selected Event</label>
            <select id="eventSelect" name="event"></select>
            <small class="error" role="alert"></small>
          </div>
          <div class="form-group">
            <label for="tickets">Number of tickets</label>
            <select id="tickets" name="tickets"><option value="1">1</option></select>
            <small class="error" role="alert"></small>
          </div>

          <div class="total-row"><span>Total</span><strong id="totalPrice">—</strong></div>

          <div class="form-group check">
            <label><input type="checkbox" name="terms" /> I agree to the event terms &amp; conditions.</label>
            <small class="error" role="alert"></small>
          </div>

          <button id="submitBtn" type="submit" class="btn btn-primary full">Register Now</button>
        </form>
      </aside>
    </div>

    <section id="related" class="related" aria-labelledby="relTitle">
      <h2 id="relTitle" class="section-title left">You may also like</h2>
      <div id="relatedGrid" class="grid"></div>
    </section>
  </main>

  <!-- Success modal -->
  <dialog id="ticketModal" aria-labelledby="modalTitle">
    <div id="ticketBody"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-outline small" id="modalCal">📆 Add to calendar</button>
      <a class="btn btn-primary small" href="my-tickets.html">View my tickets</a>
      <button type="button" class="btn btn-outline small" id="modalClose">Close</button>
    </div>
  </dialog>

  <footer class="footer">
    <p class="copy">© <span id="year">2026</span> Eventora. Built for K Explore – Web Designing.</p>
  </footer>

  <button id="toTop" class="to-top" aria-label="Back to top">↑</button>

  <script src="js/common.js"></script>
  <script src="js/data.js"></script>
  <script src="js/event.js"></script>
</body>
</html>
